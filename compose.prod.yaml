# Production environment override
services:
  api:
    build:
      context: ./api
      target: frankenphp_prod
    environment:
      APP_SECRET: ${APP_SECRET}
      MERCURE_PUBLISHER_JWT_KEY: ${CADDY_MERCURE_JWT_SECRET:?Set CADDY_MERCURE_JWT_SECRET to a strong secret}
      MERCURE_SUBSCRIBER_JWT_KEY: ${CADDY_MERCURE_SUBSCRIBER_JWT_SECRET:-${CADDY_MERCURE_JWT_SECRET:?Set CADDY_MERCURE_JWT_SECRET to a strong secret}}
      MERCURE_JWT_SECRET: ${CADDY_MERCURE_JWT_SECRET:?Set CADDY_MERCURE_JWT_SECRET to a strong secret}
      MERCURE_SUBSCRIBER_JWT_SECRET: ${CADDY_MERCURE_SUBSCRIBER_JWT_SECRET:-${CADDY_MERCURE_JWT_SECRET:?Set CADDY_MERCURE_JWT_SECRET to a strong secret}}
  worker:
    build:
      context: ./api
      target: frankenphp_prod
    environment:
      APP_SECRET: ${APP_SECRET}
      MERCURE_PUBLISHER_JWT_KEY: ${CADDY_MERCURE_JWT_SECRET:?Set CADDY_MERCURE_JWT_SECRET to a strong secret}
      MERCURE_SUBSCRIBER_JWT_KEY: ${CADDY_MERCURE_SUBSCRIBER_JWT_SECRET:-${CADDY_MERCURE_JWT_SECRET:?Set CADDY_MERCURE_JWT_SECRET to a strong secret}}
      MERCURE_JWT_SECRET: ${CADDY_MERCURE_JWT_SECRET:?Set CADDY_MERCURE_JWT_SECRET to a strong secret}
      MERCURE_SUBSCRIBER_JWT_SECRET: ${CADDY_MERCURE_SUBSCRIBER_JWT_SECRET:-${CADDY_MERCURE_JWT_SECRET:?Set CADDY_MERCURE_JWT_SECRET to a strong secret}}

  pwa:
    build:
      context: ./pwa
      target: prod

  database:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
