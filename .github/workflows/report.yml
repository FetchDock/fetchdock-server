name: 'Reports'
on:
  workflow_run: 
    workflows: ['CI']
    types:
      - completed

permissions: 
  contents: read
  actions: read
  checks: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      # With `artifact`, the reporter downloads the artifact from the CI run that triggered this workflow.
      # CI uploads build/logs/*.xml, which ends up at the root of the artifact.
      - uses: dorny/test-reporter@v3
        with:
          artifact: test-results
          name: PHP Unit Tests
          path: 'junit.xml'
          reporter: phpunit-junit

