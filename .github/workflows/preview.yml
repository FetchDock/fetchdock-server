name: Preview

# Builds images for every feature/** commit that passed CI, for manual testing on a separate server.
# Integration branches collect the PRs of a milestone before it is merged into develop (e.g. feature/109-download-directories).
# Nothing is deployed. Images are tagged with the branch (feature-109-download-directories) and the commit (sha-<short>).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: ['feature/**']
  workflow_dispatch: ~

env:
  REGISTRY: ghcr.io

concurrency:
  group: preview-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: true

jobs:
  publish:
    name: Publish preview images
    # Pushes only: a pull request from a feature branch must not publish images
    if: ${{ (github.event_name == 'workflow_dispatch' && startsWith(github.ref_name, 'feature/')) || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - name: Compute version
        id: version
        env:
          BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
        run: |
          set -eu
          short=$(git rev-parse --short=7 HEAD)
          # Docker tags allow [A-Za-z0-9_.-]: feature/109-download-directories → feature-109-download-directories
          branch_tag=$(printf '%s' "$BRANCH" | tr -c 'A-Za-z0-9_.-' '-' | cut -c1-120)
          # Next patch after the latest stable release, as a semver pre-release: 0.7.3 → 0.7.4-dev.<sha> (minor bumps are only for client-breaking changes)
          last=$(git tag --list --sort=-v:refname | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 | sed 's/^v//')
          IFS=. read -r major minor patch <<<"${last:-0.0.0}"
          {
            echo "sha=$(git rev-parse HEAD)"
            echo "tag=sha-$short"
            echo "tags=sha-$short,$branch_tag"
            echo "version=$major.$minor.$((patch + 1))-dev.$short"
          } >> "$GITHUB_OUTPUT"
      - name: Set registry name
        run: echo "IMAGE_PREFIX=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Docker images
        uses: docker/bake-action@v7
        env:
          IMAGES_PREFIX: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}
          TAGS: ${{ steps.version.outputs.tags }}
          # compose.prod.yaml requires the Mercure secret, and bake interpolates the whole file although it only
          # uses the build sections: a placeholder satisfies it and never ends up in the images
          CADDY_MERCURE_JWT_SECRET: bake-placeholder-not-a-secret
        with:
          source: .
          pull: true
          push: true
          files: |
            compose.yaml
            compose.prod.yaml
            ./docker-bake.hcl
          set: |
            api.cache-from=type=gha,scope=api-preview
            api.cache-to=type=gha,scope=api-preview,mode=max
            pwa.cache-from=type=gha,scope=pwa-preview
            pwa.cache-to=type=gha,scope=pwa-preview,mode=max
            api.args.APP_VERSION=${{ steps.version.outputs.version }}
            api.args.GIT_SHA=${{ steps.version.outputs.sha }}
            pwa.args.APP_VERSION=${{ steps.version.outputs.version }}
      - name: Summary
        env:
          TAGS: ${{ steps.version.outputs.tags }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          {
            echo "### Preview images ($VERSION)"
            echo "Tags: \`${TAGS//,/\`, \`}\` on \`${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api\` and \`-pwa\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # Publishes the image's integrity manifest digest (ADR 0013), so preview instances can read "verified"
  integrity-digest:
    name: Integrity digest
    needs: publish
    permissions:
      contents: write
      packages: read
    uses: ./.github/workflows/integrity-digest.yml
    with:
      image-tag: ${{ needs.publish.outputs.tag }}
      version: ${{ needs.publish.outputs.version }}
