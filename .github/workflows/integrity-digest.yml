name: Integrity digest

# Publishes the integrity manifest digest of a pushed api image (ADR 0013, server#121). Instances fetch
# releases/download/integrity-digests/<APP_VERSION>.sha256 and compare it with their own manifest, so every official
# build (release, staging -dev, preview -dev) uploads one to the rolling "integrity-digests" pre-release. Release
# builds also attach integrity-manifest.sha256 to their own release. -dev digests older than 90 days are pruned.
#
# The "integrity-digests" pre-release is created on first use. It is not a version: publish.yml ignores it, and a
# release created with GITHUB_TOKEN doesn't trigger workflows anyway.
on:
  workflow_call:
    inputs:
      image-tag:
        description: Tag of the pushed api image, e.g. sha-abc1234 or 0.9.0
        type: string
        required: true
      version:
        description: APP_VERSION the image was built with
        type: string
        required: true
      release-tag:
        description: Release to attach integrity-manifest.sha256 to (release builds only)
        type: string
        default: ''

env:
  REGISTRY: ghcr.io
  DIGESTS_TAG: integrity-digests
  DEV_RETENTION_DAYS: 90

jobs:
  digest:
    name: Publish integrity digest
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute the digest
        id: digest
        env:
          IMAGE_TAG: ${{ inputs.image-tag }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          image="${REGISTRY}/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')-api:${IMAGE_TAG}"
          mkdir -p digest
          docker pull --quiet "$image"
          docker run --rm --entrypoint cat "$image" /app/integrity-manifest.json > digest/integrity-manifest.json
          if ! jq -e --arg version "$VERSION" '.version == $version and (.files | length) > 0' digest/integrity-manifest.json > /dev/null; then
            echo "::error title=Invalid integrity manifest::$image has no manifest for version $VERSION"
            exit 1
          fi
          digest=$(sha256sum digest/integrity-manifest.json | cut -d' ' -f1)
          printf '%s  integrity-manifest.json\n' "$digest" > "digest/${VERSION}.sha256"
          cp "digest/${VERSION}.sha256" digest/integrity-manifest.sha256
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          {
            echo "### Integrity digest ($VERSION)"
            echo "\`$digest\` ($(jq '.files | length' digest/integrity-manifest.json) files, \`$image\`)"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload to the integrity-digests pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if ! gh release view "$DIGESTS_TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # Parallel builds may race to create it
            gh release create "$DIGESTS_TAG" -R "$GITHUB_REPOSITORY" --prerelease --latest=false \
              --title "Integrity digests" \
              --notes "Manifest digests of every official api image (ADR 0013). Instances compare their integrity manifest with <version>.sha256. Not a release; -dev digests are removed after ${DEV_RETENTION_DAYS} days." \
              || gh release view "$DIGESTS_TAG" -R "$GITHUB_REPOSITORY" > /dev/null
          fi
          gh release upload "$DIGESTS_TAG" "digest/${VERSION}.sha256" -R "$GITHUB_REPOSITORY" --clobber
      - name: Attach to the release
        if: ${{ inputs.release-tag != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: gh release upload "$RELEASE_TAG" digest/integrity-manifest.sha256 -R "$GITHUB_REPOSITORY" --clobber
      - name: Prune old -dev digests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cutoff=$(date -u -d "${DEV_RETENTION_DAYS} days ago" +%Y-%m-%dT%H:%M:%SZ)
          release_id=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${DIGESTS_TAG}" --jq '.id')
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?per_page=100" \
            --jq ".[] | select(.name | test(\"-dev\\\\.\")) | select(.created_at < \"${cutoff}\") | \"\(.id) \(.name)\"" \
            | while read -r id name; do
                echo "Deleting $name"
                gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${id}"
              done
