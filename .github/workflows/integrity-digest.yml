name: Integrity digest

# Publishes the integrity manifest digest of a pushed api image (ADR 0013, server#121). Instances fetch
# https://raw.githubusercontent.com/FetchDock/fetchdock-server/integrity-data/<APP_VERSION>.sha256 and compare it
# with their own manifest. Every official build (release, staging -dev, preview -dev) commits its digest to the
# orphan "integrity-data" branch (which works with GitHub Immutable Releases enabled). -dev digests older than
# 90 days are pruned.
on:
  workflow_call:
    inputs:
      image-tag:
        description: Tag of the pushed api image, e.g. sha-abc1234 or 0.9.0
        type: string
        required: true
      version:
        description: APP_VERSION the image was built with
        type: string
        required: true

env:
  REGISTRY: ghcr.io
  DIGESTS_BRANCH: integrity-data
  DEV_RETENTION_DAYS: 90

jobs:
  digest:
    name: Publish integrity digest
    runs-on: ubuntu-latest
    concurrency:
      group: integrity-data
      cancel-in-progress: false
    permissions:
      contents: write
      packages: read
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute the digest
        id: digest
        env:
          IMAGE_TAG: ${{ inputs.image-tag }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          image="${REGISTRY}/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')-api:${IMAGE_TAG}"
          mkdir -p digest
          docker pull --quiet "$image"
          docker run --rm --entrypoint cat "$image" /app/integrity-manifest.json > digest/integrity-manifest.json
          if ! jq -e --arg version "$VERSION" '.version == $version and (.files | length) > 0' digest/integrity-manifest.json > /dev/null; then
            echo "::error title=Invalid integrity manifest::$image has no manifest for version $VERSION"
            exit 1
          fi
          digest=$(sha256sum digest/integrity-manifest.json | cut -d' ' -f1)
          printf '%s  integrity-manifest.json\n' "$digest" > "digest/${VERSION}.sha256"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          {
            echo "### Integrity digest ($VERSION)"
            echo "\`$digest\` ($(jq '.files | length' digest/integrity-manifest.json) files, \`$image\`)"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish to the integrity-data branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          cutoff=$(date -u -d "${DEV_RETENTION_DAYS} days ago" +%s)
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          for attempt in 1 2 3 4 5; do
            rm -rf digests-repo
            git init -q digests-repo
            (
              cd digests-repo
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git remote add origin "$remote"

              if git fetch -q origin "$DIGESTS_BRANCH" 2>/dev/null; then
                git checkout -q -B "$DIGESTS_BRANCH" FETCH_HEAD
              else
                git checkout -q --orphan "$DIGESTS_BRANCH"
                printf '%s\n' \
                  '# FetchDock integrity digests' \
                  '' \
                  'Manifest digests of official `fetchdock-server-api` images (ADR 0013).' \
                  'Instances compare their baked `integrity-manifest.json` digest with `<version>.sha256`.' \
                  "\`-dev\` digests older than ${DEV_RETENTION_DAYS} days are pruned automatically." \
                  > README.md
                git add README.md
              fi

              cp "../digest/${VERSION}.sha256" "${VERSION}.sha256"
              git add "${VERSION}.sha256"

              shopt -s nullglob
              for file in *-dev.*.sha256; do
                [ "$file" = "${VERSION}.sha256" ] && continue
                ts=$(git log -1 --format=%ct -- "$file" 2>/dev/null || true)
                if [ -n "$ts" ] && [ "$ts" -lt "$cutoff" ]; then
                  echo "Pruning expired digest $file"
                  git rm -q "$file"
                fi
              done

              if git diff --cached --quiet; then
                echo "Digest for ${VERSION} is already up to date."
                exit 0
              fi

              git commit -q -m "Publish integrity digest for ${VERSION}"
              git push -q origin "$DIGESTS_BRANCH"
            ) && exit 0

            echo "Push attempt ${attempt} failed; retrying..."
            sleep 2
          done

          echo "::error title=Failed to publish integrity digest::Could not push to ${DIGESTS_BRANCH} after 5 attempts"
          exit 1
