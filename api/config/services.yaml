# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    locale: 'en'
    # Directory the default DownloadDirectory is seeded with, and where the global yt-dlp archive lives
    app.download_dir: '/downloads'
    # Comma-separated allowlist that every download directory must resolve inside (ADR 0011)
    env(DOWNLOAD_ROOTS): '/downloads'
    app.download_roots: '%env(csv:DOWNLOAD_ROOTS)%'

    # Lifetime in seconds of Mercure subscriber tokens issued to clients (POST /users/me/subscription-token)
    env(MERCURE_SUBSCRIPTION_TOKEN_TTL): '3600'
    app.mercure.subscription_token_ttl: '%env(int:MERCURE_SUBSCRIPTION_TOKEN_TTL)%'
    # Mercure JWT keys: MERCURE_JWT_SECRET is the hub's publisher key, MERCURE_SUBSCRIBER_JWT_SECRET its subscriber key.
    # The subscriber key is optional and defaults to the publisher key (see #88).
    app.mercure.publisher_jwt_secret: '%env(MERCURE_JWT_SECRET)%'
    app.mercure.subscriber_jwt_secret: '%env(default:app.mercure.publisher_jwt_secret:MERCURE_SUBSCRIBER_JWT_SECRET)%'
    # Failure reports from clients (ADR 0012): FAILURE_REPORTS_ENABLED=0 refuses new reports and hides the feature
    # from clients; PRIVACY_POLICY_URL is the instance's privacy policy, linked by clients and the admin
    env(FAILURE_REPORTS_ENABLED): 'true'
    app.failure_reports.enabled: '%env(bool:FAILURE_REPORTS_ENABLED)%'
    env(PRIVACY_POLICY_URL): ''
    app.privacy_policy_url: '%env(PRIVACY_POLICY_URL)%'
    downloader.gallery_dl_web.enabled: false
    downloader.gallery_dl_web.host: 'http://gallery-dl:9080'

    downloader.gallery_dl_cli.enabled: true
    downloader.gallery_dl_cli.downloads_dir: '%app.download_dir%'
    downloader.gallery_dl_cli.binary_path: 'gallery-dl'
    downloader.gallery_dl_cli.config_path: '%kernel.project_dir%/config/gallery-dl/config.json'

    downloader.yt_dlp.enabled: true
    downloader.yt_dlp.binary_path: 'yt-dlp'
    downloader.yt_dlp_cli.enabled: true
    downloader.yt_dlp_cli.downloads_dir: '%app.download_dir%'
    downloader.yt_dlp_cli.binary_path: 'yt-dlp'
    downloader.yt_dlp_cli.config_path: '%kernel.project_dir%/config/yt-dlp/yt-dlp.conf'

    oidc.enabled: '%env(default:oidc_defaults_enabled:bool:OIDC_ENABLED)%'
    oidc.client_id: '%env(default:oidc_defaults_client_id:OIDC_CLIENT_ID)%'
    oidc.client_secret: '%env(default:oidc_defaults_client_secret:OIDC_CLIENT_SECRET)%'
    oidc.well_known_url: '%env(default:oidc_defaults_well_known_url:OIDC_WELL_KNOWN_URL)%'
    oidc.audience: '%env(default:oidc_defaults_client_id:OIDC_CLIENT_ID)%'
    oidc.token_url: '%env(default:oidc_defaults_token_url:OIDC_TOKEN_URL)%'
    oidc.authorization_url: '%env(default:oidc_defaults_authorization_url:OIDC_AUTHORIZATION_URL)%'
    oidc.issuer: '%env(default:oidc_defaults_issuer:OIDC_ISSUER)%'
    oidc.discovery_base_uri: '%env(default:oidc_defaults_discovery_base_uri:OIDC_DISCOVERY_BASE_URI)%'
    fallback.claim: 'sub'
    oidc.claim: '%env(default:fallback.claim:OIDC_CLAIM)%'
    oidc_defaults_enabled: false
    oidc_defaults_client_id: '0'
    oidc_defaults_client_secret: '0'
    oidc_defaults_well_known_url: '0'
    oidc_defaults_token_url: '0'
    oidc_defaults_authorization_url: '0'
    oidc_defaults_issuer: '0'
    oidc_defaults_discovery_base_uri: '0'

    app_version_default: 'dev'
    app.version: '%env(default:app_version_default:APP_VERSION)%'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    _instanceof:
        App\Service\Downloader\DownloaderInterface:
            tags: ['app.downloader']

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude: '../src/{DependencyInjection,Entity,Tests,Kernel.php}'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    # Allow the API to filter results which belong to the authenticated user
    # and not belonging to other users
    'App\Doctrine\CurrentUserExtension':
        tags:
            - { name: api_platform.doctrine.orm.query_extension.collection }
            - { name: api_platform.doctrine.orm.query_extension.item }

    # Gedmo SoftDeleteable Extension Listener
    # Turns removals of #[Gedmo\SoftDeleteable] entities into setting their deletedAt field
    gedmo.listener.softdeleteable:
        class: Gedmo\SoftDeleteable\SoftDeleteableListener
        tags:
            - { name: doctrine.event_listener, event: 'onFlush' }
            - { name: doctrine.event_listener, event: 'loadClassMetadata' }

    # Gedmo Timestampable Extension Listener
    gedmo.listener.timestampable:
        class: Gedmo\Timestampable\TimestampableListener
        tags:
            - { name: doctrine.event_listener, event: 'prePersist' }
            - { name: doctrine.event_listener, event: 'onFlush' }
            - { name: doctrine.event_listener, event: 'loadClassMetadata' }
        calls:
            # Uncomment the below call if using attributes, and comment the call for the annotation reader
            # - [ setAnnotationReader, [ '@gedmo.mapping.driver.attribute' ] ]
            # The `annotation_reader` service was deprecated in Symfony 6.4 and removed in Symfony 7.0
            # - [ setAnnotationReader, [ '@annotation_reader' ] ]
            # The `clock` service was introduced in Symfony 6.2; if using an older Symfony version, you can either comment this call or provide your own PSR-20 Clock implementation
            - [ setClock, [ '@clock' ] ]

    # Publishes to the Mercure hub with the publisher key, replacing the provider the bundle builds from the subscriber
    # key (see config/packages/mercure.yaml)
    app.mercure.publisher_token_provider:
        class: Symfony\Component\Mercure\Jwt\FactoryTokenProvider
        decorates: mercure.hub.default.jwt.provider
        arguments:
            $factory: !service
                class: Symfony\Component\Mercure\Jwt\LcobucciFactory
                arguments: ['%app.mercure.publisher_jwt_secret%']
            $publish: ['*']

when@test:
    parameters:
        # Tests create download directories under their own root (tests/Api/AdminDownloadDirectoriesTest)
        app.download_roots: ['/downloads', '%kernel.project_dir%/var/test-download-roots']

    services:
        # Don't run bin/resolve_url.py in functional tests
        App\Service\Site\ExtractorMatcherInterface:
            class: App\Tests\Double\FakeExtractorMatcher
        # Don't run bin/dump_options.py in functional tests
        App\Service\Downloader\Options\OptionsDumperInterface:
            class: App\Tests\Double\FakeOptionsDumper
