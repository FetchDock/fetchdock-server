# Curated sites, synchronised into the database by `bin/console app:sites:sync` (on deploy and after
# downloader updates). URLs of other sites are grouped automatically: one site per extractor family.
#
# <slug>:
#   name:       Display name
#   domains:    Host names of the site. Hosts known by the tools are added when they are one of these
#               domains or a subdomain of one.
#   families:   Extractor families mapped to this site, for every downloader (gallery-dl category,
#               yt-dlp extractor module, e.g. "youtube" for Youtube, YoutubeTab, YoutubePlaylist, ...)
#   extractors: (optional) Extra extractor keys per downloader identifier, e.g. {yt-dlp-cli: [Douyin]}
#   enabled:    (optional, default true)
#   defaults:   (optional) Site defaults: sendCookies, sendUserAgent, sendReferrer (bool), downloader
#               (downloader identifier). Omitted = inherit the global defaults.
#   canonicalization: (optional) Duplicate detection rules (see config/packages/url_canonicalization.yaml):
#               profile (code profile name; default: the one named after the slug, else "default"),
#               useExtractorId, keepParams, dropParams, stripWww, stripTrailingSlash, idGroups.
sites:
    bluesky:
        name: Bluesky
        domains: [bsky.app]
        families: [bluesky]
    deviantart:
        name: DeviantArt
        domains: [deviantart.com, www.deviantart.com]
        families: [deviantart]
    imgur:
        name: Imgur
        domains: [imgur.com, i.imgur.com, www.imgur.com]
        families: [imgur]
    instagram:
        name: Instagram
        domains: [instagram.com, www.instagram.com]
        families: [instagram]
    pixiv:
        name: pixiv
        domains: [pixiv.net, www.pixiv.net, pixiv.me, sketch.pixiv.net, www.pixivision.net]
        families: [pixiv]
    reddit:
        name: Reddit
        domains: [reddit.com, www.reddit.com, old.reddit.com, redd.it, i.redd.it, v.redd.it]
        families: [reddit]
    soundcloud:
        name: SoundCloud
        domains: [soundcloud.com, m.soundcloud.com]
        families: [soundcloud]
    tiktok:
        name: TikTok
        domains: [tiktok.com, www.tiktok.com, m.tiktok.com, vm.tiktok.com, vt.tiktok.com]
        families: [tiktok]
    tumblr:
        name: Tumblr
        domains: [tumblr.com, www.tumblr.com]
        families: [tumblr]
    twitch:
        name: Twitch
        domains: [twitch.tv, www.twitch.tv, m.twitch.tv, clips.twitch.tv]
        families: [twitch]
    twitter:
        name: Twitter / X
        domains: [x.com, twitter.com, www.x.com, www.twitter.com, mobile.twitter.com, mobile.x.com, t.co, pbs.twimg.com, video.twimg.com]
        families: [twitter]
    vimeo:
        name: Vimeo
        domains: [vimeo.com, player.vimeo.com]
        families: [vimeo]
    youtube:
        name: YouTube
        domains: [youtube.com, www.youtube.com, m.youtube.com, music.youtube.com, youtu.be, www.youtubekids.com, youtube-nocookie.com, www.youtube-nocookie.com]
        families: [youtube]
