framework:
    rate_limiter:
        # GET /sites/resolve: each call may run the extractor matcher (bin/resolve_url.py)
        site_resolve:
            policy: sliding_window
            limit: 60
            interval: '1 minute'
        # POST /users/failure_reports, per user (ADR 0012)
        failure_report:
            policy: sliding_window
            limit: 20
            interval: '1 hour'

when@test:
    framework:
        rate_limiter:
            # Functional tests resolve many URLs; the limit itself is covered by ResolveSiteProviderTest
            site_resolve:
                policy: sliding_window
                limit: 100000
                interval: '1 minute'
            # Covered by FailureReportProcessorTest
            failure_report:
                policy: sliding_window
                limit: 100000
                interval: '1 hour'
