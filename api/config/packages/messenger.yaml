framework:
    messenger:
        # Uncomment this (and the failed transport below) to send failed messages to this transport for later handling.
        # failure_transport: failed

        transports:
            # https://symfony.com/doc/current/messenger.html#transport-configuration
            async: 'doctrine://default?auto_setup=false&queue_name=messages'
            download-jobs: 'doctrine://default?auto_setup=false&queue_name=download-jobs'
            logs: 'doctrine://default?auto_setup=false&queue_name=logs'
            failed: 'doctrine://default?auto_setup=false&queue_name=failed'
            # File moves (#109): consumed after "async" (messenger:consume async file-moves), so downloads go first
            file-moves:
                dsn: 'doctrine://default?auto_setup=false&queue_name=file-moves'
                retry_strategy:
                    max_retries: 2 # MoveFileHandler::MAX_ATTEMPTS in all
                    delay: 30000
                    multiplier: 4
            # Failure reports for the FetchDock collector (phase 2 of ADR 0012): consumed first, the calls are short.
            # Retries for about two days while the collector is unreachable, then the message stays in "failed".
            failure-reports:
                dsn: 'doctrine://default?auto_setup=false&queue_name=failure-reports'
                failure_transport: failed
                retry_strategy:
                    max_retries: 8
                    delay: 60000
                    multiplier: 3
                    max_delay: 86400000
            # sync: 'sync://'

        routing:
            'App\Entity\DownloadJob': async
            'App\Message\StartFileMoveBatchMessage': file-moves
            'App\Message\MoveFileMessage': file-moves
            'App\Message\PurgeFilesMessage': async
            'App\Message\ForwardFailureReportMessage': failure-reports
            'App\Message\ForwardUpstreamCommentMessage': failure-reports
            'App\Message\DeleteUpstreamReportMessage': failure-reports
            # Route your messages to the transports
            # 'App\Message\YourMessage': async

when@test:
    framework:
        messenger:
            transports:
                # replace with your transport name here (e.g., my_transport: 'in-memory://')
                # For more Messenger testing tools, see https://github.com/zenstruck/messenger-test
                async: 'in-memory://'
                file-moves: 'in-memory://'
                failure-reports: 'in-memory://'
